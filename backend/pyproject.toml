[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gfp-backend"
version = "0.1.0"
description = "Gestor Inteligente de Finanzas Personales — API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # El extra `email` trae email-validator, que es lo que respalda a EmailStr.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Argon2id en vez de passlib+bcrypt: passlib no se mantiene desde 2020 y se
    # lleva mal con bcrypt 4.x, y bcrypt trunca las contraseñas a 72 bytes.
    # Argon2id es además la recomendación actual de OWASP.
    "argon2-cffi>=23.1",
    # PyJWT y no python-jose: este último tiene mantenimiento irregular y
    # arrastra CVEs; PyJWT hace lo mismo con menos superficie.
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    # PyMySQL (vía aiomysql) necesita cryptography para autenticarse contra
    # MySQL 8, que usa caching_sha2_password por defecto. Sin esto la conexión
    # falla con "cryptography package is required".
    "cryptography>=43.0",
    "alembic>=1.14",
    # Requerido por FastAPI para leer multipart, que es como llega la foto del
    # ticket. Sin esto el endpoint devuelve un error de dependencia al arrancar.
    "python-multipart>=0.0.20",
    # Job de movimientos recurrentes, in-process. Con una sola réplica alcanza:
    # la idempotencia la garantiza la UNIQUE de `recurring_occurrences`.
    "apscheduler>=3.11,<4",
    # Asistente conversacional. `langchain-openai` trae el cliente del modelo y
    # `langchain` el agente con tool calling.
    # El major va acotado a propósito: `create_agent` y `ModelCallLimitMiddleware`
    # son de la 1.x. La 0.3 traía `AgentExecutor`, que ya no existe, así que un
    # rango más laxo dejaría instalar una versión donde la app no arranca.
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + formato
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff
]
ignore = [
    "B008",  # Depends() en defaults es el idioma de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
# Sin esto, el directorio `alembic/` del proyecto hace que isort clasifique el
# paquete `alembic` como código propio y lo ordene junto a `app`.
known-third-party = ["alembic"]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
# Sin `py.typed`: no publican tipos y no hay stubs oficiales.
module = ["aiomysql.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un único event loop para toda la sesión. Con un loop por test, el pool de
# conexiones cacheado en `get_engine` queda atado a un loop muerto y hay que
# cerrarlo entre casos, lo que rehace el handshake con MySQL en cada test y
# multiplica por diez el tiempo de la suite.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: requiere base de datos real",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
