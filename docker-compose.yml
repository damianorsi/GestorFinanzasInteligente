name: gestor-finanzas-personales

services:
  db:
    image: mysql:8.0
    container_name: gfp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finanzas}
      MYSQL_USER: ${MYSQL_USER:-finanzas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definir en .env}
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # UTC, no APP_TIMEZONE: las fechas de negocio son DATE sin hora (sin
      # ambigüedad de zona) y los timestamps de auditoría se guardan en UTC
      # (PROMPT §5.2). Con la sesión en UTC, el CURRENT_TIMESTAMP de los
      # defaults de columna coincide con esa regla.
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta solo cuando el volumen se inicializa vacío. Crea la base de
      # test, que la suite trunca entre casos y por eso no puede ser la de
      # desarrollo.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # CMD-SHELL y no CMD: la forma exec no pasa por un shell, así que
      # $MYSQL_ROOT_PASSWORD quedaría como texto literal y el ping fallaría.
      # El `$$` es el escape de compose para que la variable la resuelva el
      # contenedor y no el archivo compose.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./backend
      target: dev
    container_name: gfp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Montaje para hot-reload en desarrollo. PYTHONPATH=/srv hace que este
      # código tenga prioridad sobre la copia instalada en el venv.
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests
      - ./backend/alembic:/srv/alembic
      # También la configuración: si quedara la copia horneada en la imagen,
      # ruff, mypy y pytest correrían local con reglas distintas a las de CI.
      - ./backend/pyproject.toml:/srv/pyproject.toml:ro
      - ./backend/alembic.ini:/srv/alembic.ini:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: gfp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
