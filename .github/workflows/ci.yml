name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: finanzas_test
          MYSQL_USER: finanzas
          MYSQL_PASSWORD: finanzas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: mysql+aiomysql://finanzas:finanzas@127.0.0.1:3306/finanzas_test?charset=utf8mb4
      JWT_SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
      OPENAI_API_KEY: sk-dummy-ci
      APP_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy app

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  docker:
    name: Build de imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend (target runtime)
        run: docker build --target runtime -t gfp-backend:ci ./backend

      - name: Build frontend
        run: docker build -t gfp-frontend:ci ./frontend
